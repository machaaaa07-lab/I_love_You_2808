<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impress Her With This 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts-background" id="hearts"></div>

    <main class="container">
        <section class="welcome-screen" id="welcomeScreen">

            <div class="heart-icon">💗</div>

            <p class="small-text">A little something for you</p>

            <h1>Hey, Beautiful! ✨</h1>

            <p class="message">
                I made something special just for you.
                Are you ready to see it?
            </p>

            <button id="startButton" onclick="startSurprise()">
                Open Your Surprise 💌
            </button>

        </section>

        <section class="surprise-screen hidden" id="surpriseScreen">
            <div class="gift">🎁</div>
            <h1>Something Special Awaits!</h1>
            <p>Every little thing here is made with love. ❤️</p>
            <button onclick="nextPage()">Continue 💗</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
